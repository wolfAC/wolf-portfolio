<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520">
  <title>Cyber City — original top-down layout sketch (Phase A3)</title>
  <desc>Hub-and-ring topology: central Transit Nexus hub, an inner ring road, 6 radial avenues leading to 6 outer districts, and 6 small alley pockets tucked inside the ring. Coordinates match audit/assets/cyber-city-layout.json (scale: 1 world unit = 2 svg units, origin at 260,260).</desc>

  <rect x="0" y="0" width="520" height="520" fill="#05030a" />

  <!-- world boundary (half-extent 130 -> r=260) -->
  <circle cx="260" cy="260" r="260" fill="none" stroke="#23212f" stroke-width="1" stroke-dasharray="4 6" />

  <!-- ring road (radius 90 -> r=180, width 8 -> stroke 16) -->
  <circle cx="260" cy="260" r="180" fill="none" stroke="#1c1b22" stroke-width="16" />
  <circle cx="260" cy="260" r="180" fill="none" stroke="#28e0ff" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" />

  <!-- radial avenues: hub edge (r=36) to ring (r=180), width 8 -> stroke 16 -->
  <g stroke="#1c1b22" stroke-width="16" stroke-linecap="round">
    <line x1="296" y1="260" x2="440" y2="260" />
    <line x1="278" y1="291.18" x2="350" y2="415.88" />
    <line x1="242" y1="291.18" x2="170" y2="415.88" />
    <line x1="224" y1="260" x2="80" y2="260" />
    <line x1="242" y1="228.82" x2="170" y2="104.12" />
    <line x1="278" y1="228.82" x2="350" y2="104.12" />
  </g>

  <!-- gate spurs: ring (r=180) to district anchors (r=224), width 6 -> stroke 12 -->
  <g stroke="#1c1b22" stroke-width="12" stroke-linecap="round">
    <line x1="440" y1="260" x2="484" y2="260" />
    <line x1="350" y1="415.88" x2="372" y2="453.98" />
    <line x1="170" y1="415.88" x2="148" y2="453.98" />
    <line x1="80" y1="260" x2="36" y2="260" />
    <line x1="170" y1="104.12" x2="148" y2="66.02" />
    <line x1="350" y1="104.12" x2="372" y2="66.02" />
  </g>

  <!-- alley connectors: ring (r=180) inward to alley nodes (r=160), width 4 -> stroke 8 -->
  <g stroke="#1c1b22" stroke-width="8" stroke-linecap="round">
    <line x1="398.57" y1="340" x2="370" y2="322" />
    <line x1="260" y1="420" x2="260" y2="386" />
    <line x1="121.43" y1="340" x2="150" y2="322" />
    <line x1="121.43" y1="180" x2="150" y2="198" />
    <line x1="260" y1="100" x2="260" y2="134" />
    <line x1="398.57" y1="180" x2="370" y2="198" />
  </g>

  <!-- hub: Transit Nexus (radius 18 -> r=36) -->
  <circle cx="260" cy="260" r="36" fill="#1c1b22" stroke="#ff2e8a" stroke-width="2" />
  <circle cx="260" cy="260" r="4" fill="#ff2e8a" />
  <text x="260" y="264" font-size="9" fill="#ffffff" text-anchor="middle" font-family="sans-serif">Transit Nexus</text>

  <!-- districts: radius 112 -> r=224, footprint radius 15 -> r=30 -->
  <g font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">
    <circle cx="484" cy="260" r="30" fill="#3a1b2c" stroke="#ff2e8a" stroke-width="2" />
    <text x="484" y="245">Corporate Spire</text>
    <text x="484" y="278" fill="#8a8698">career</text>

    <circle cx="372" cy="453.98" r="30" fill="#1b2a3a" stroke="#28e0ff" stroke-width="2" />
    <text x="372" y="438.98">Holo-Bazaar</text>
    <text x="372" y="471.98" fill="#8a8698">projects</text>

    <circle cx="148" cy="453.98" r="30" fill="#3a2c1b" stroke="#ffb020" stroke-width="2" />
    <text x="148" y="438.98">Broadcast Plaza</text>
    <text x="148" y="471.98" fill="#8a8698">social</text>

    <circle cx="36" cy="260" r="30" fill="#1b2a3a" stroke="#28e0ff" stroke-width="2" />
    <text x="36" y="245">Undercroft Yard</text>
    <text x="36" y="278" fill="#8a8698">lab</text>

    <circle cx="148" cy="66.02" r="30" fill="#173a1e" stroke="#8dff4f" stroke-width="2" />
    <text x="148" y="51.02">Skyline Obs.</text>
    <text x="148" y="84.02" fill="#8a8698">achievements</text>

    <circle cx="372" cy="66.02" r="30" fill="#3a1b2c" stroke="#ff2e8a" stroke-width="2" />
    <text x="372" y="51.02">Dev Circuit</text>
    <text x="372" y="84.02" fill="#8a8698">circuit</text>
  </g>

  <!-- alley nodes: radius 80 -> r=160, footprint radius 8 -> r=16 -->
  <g font-family="sans-serif" font-size="7" fill="#c9c6d1" text-anchor="middle">
    <circle cx="398.57" cy="340" r="16" fill="#23212f" stroke="#ffb020" stroke-width="1.5" />
    <text x="398.57" y="357">Archive Substation</text>

    <circle cx="260" cy="420" r="16" fill="#23212f" stroke="#ffb020" stroke-width="1.5" />
    <text x="260" y="437">Overclock Arcade</text>

    <circle cx="121.43" cy="340" r="16" fill="#23212f" stroke="#ffb020" stroke-width="1.5" />
    <text x="121.43" y="357">Server Shrine</text>

    <circle cx="121.43" cy="180" r="16" fill="#23212f" stroke="#ffb020" stroke-width="1.5" />
    <text x="121.43" y="167">Glitch Vendor Alley</text>

    <circle cx="260" cy="100" r="16" fill="#23212f" stroke="#ffb020" stroke-width="1.5" />
    <text x="260" y="87">Malfunction Stall</text>

    <circle cx="398.57" cy="180" r="16" fill="#23212f" stroke="#ffb020" stroke-width="1.5" />
    <text x="398.57" y="167">Chrono Terminal</text>
  </g>
</svg>
